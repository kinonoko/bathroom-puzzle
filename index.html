<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浴室 / 浴逝 - 極簡像素文字恐怖解謎</title>
  <!-- Google Fonts: DotGothic16 for CJK pixel typography, Press Start 2P for retro digits -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* CSS Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #000000;
      --text-main: #e6e6e6;
      --text-dim: #777777;
      --text-sub: #aaaaaa;
      --text-accent: #00ff77;
      --text-danger: #ff2a4b;
      --font-pixel: 'DotGothic16', 'Press Start 2P', monospace;
      --font-num: 'Press Start 2P', monospace;
      --glitch-red: #ff1133;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-pixel);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    /* CRT & Scanline Overlay */
    .crt-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 999;
      opacity: 0.8;
    }

    /* Ambient CRT Vignette */
    .vignette-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.95);
      pointer-events: none;
      z-index: 998;
      transition: background 1.5s ease, box-shadow 1.5s ease;
    }

    /* Red glitch noise when Truth >= 70% */
    body.truth-high .vignette-overlay {
      background: radial-gradient(circle at center, rgba(80, 0, 15, 0.18) 0%, rgba(20, 0, 5, 0.6) 80%, rgba(0, 0, 0, 0.95) 100%);
      box-shadow: inset 0 0 120px rgba(180, 10, 30, 0.4);
    }

    body.truth-high .crt-overlay {
      opacity: 0.95;
      animation: crtJitter 0.15s infinite alternate;
    }

    @keyframes crtJitter {
      0% { transform: translateY(0); }
      100% { transform: translateY(1px); }
    }

    /* HUD Top Bar */
    header.hud {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #222222;
      position: relative;
      z-index: 10;
      background-color: rgba(0, 0, 0, 0.85);
    }

    .hud-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-title {
      font-size: 1.35rem;
      letter-spacing: 4px;
      font-weight: bold;
      color: #cccccc;
      transition: color 0.5s ease, text-shadow 0.5s ease;
      display: inline-block;
    }

    /* Mutated Title: 浴逝 */
    .hud-title.mutated {
      color: var(--text-danger);
      text-shadow: 0 0 10px rgba(255, 30, 60, 0.8), 2px 0 0 #00ffff, -2px 0 0 #ff0055;
      animation: glitchTitle 2.5s infinite steps(2);
    }

    @keyframes glitchTitle {
      0%, 88%, 100% {
        transform: translate(0, 0) skewX(0);
        letter-spacing: 4px;
      }
      89% {
        transform: translate(-3px, 1px) skewX(-4deg);
        letter-spacing: 6px;
      }
      92% {
        transform: translate(3px, -2px) skewX(4deg);
      }
      94% {
        transform: translate(-2px, -1px);
      }
      96% {
        transform: translate(2px, 1px);
      }
    }

    .hud-loop {
      font-size: 0.95rem;
      color: var(--text-danger);
      letter-spacing: 2px;
      display: none; /* Hidden on Round 1 */
      padding: 3px 8px;
      border: 1px dashed var(--text-danger);
      background: rgba(255, 42, 75, 0.08);
    }

    .hud-loop.visible {
      display: inline-block;
      animation: pulseSubtle 3s infinite ease-in-out;
    }

    @keyframes pulseSubtle {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; text-shadow: 0 0 8px rgba(255, 42, 75, 0.6); }
    }

    .hud-tools {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-btn {
      background: transparent;
      border: 1px solid #444;
      color: #999;
      font-family: var(--font-pixel);
      font-size: 0.85rem;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .hud-btn:hover {
      border-color: #888;
      color: #fff;
      background: #111;
    }

    /* Container for Game Content */
    main.game-container {
      flex: 1;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 10;
    }

    /* Title Screen (Cover) */
    .title-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 10px;
      animation: fadeIn 1.2s ease-out;
    }

    .title-logo-large {
      font-size: 4rem;
      letter-spacing: 16px;
      color: #ffffff;
      margin-bottom: 24px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
      animation: floatBreath 4s ease-in-out infinite;
    }

    @keyframes floatBreath {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .title-subtext {
      font-size: 1.15rem;
      color: var(--text-dim);
      letter-spacing: 3px;
      line-height: 1.8;
      margin-bottom: 40px;
      max-width: 580px;
    }

    .title-quote {
      font-size: 0.95rem;
      color: #555555;
      font-style: italic;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .start-btn {
      background: transparent;
      border: 2px solid #666;
      color: #ffffff;
      font-family: var(--font-pixel);
      font-size: 1.35rem;
      letter-spacing: 6px;
      padding: 14px 36px;
      cursor: pointer;
      position: relative;
      transition: all 0.25s;
    }

    .start-btn:hover {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
      transform: scale(1.03);
    }

    .start-btn:active {
      transform: scale(0.98);
    }

    .title-footer {
      margin-top: 48px;
      font-size: 0.85rem;
      color: #444;
      line-height: 1.6;
    }

    /* In-game Play Area */
    .play-area {
      display: none;
      flex-direction: column;
      flex: 1;
      animation: fadeIn 0.8s ease;
    }

    .scene-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #282828;
    }

    .scene-location {
      font-size: 1rem;
      color: var(--text-accent);
      letter-spacing: 2px;
    }

    .scene-time {
      font-family: var(--font-num);
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 2px;
    }

    /* Terminal Text Window */
    .dialog-box {
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid #222;
      border-left: 4px solid #444;
      padding: 24px;
      min-height: 180px;
      line-height: 2.1;
      font-size: 1.18rem;
      letter-spacing: 1.5px;
      position: relative;
      cursor: pointer;
      margin-bottom: 24px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
      border-radius: 2px;
    }

    .dialog-box:focus {
      outline: none;
    }

    .typewriter-content {
      white-space: pre-wrap;
      word-break: break-word;
      color: #e2e2e2;
    }

    /* Blinking Terminal Cursor */
    .terminal-cursor {
      display: inline-block;
      width: 10px;
      height: 1.15em;
      vertical-align: -0.15em;
      background-color: var(--text-accent);
      margin-left: 4px;
      animation: cursorBlink 0.8s infinite;
    }

    body.truth-high .terminal-cursor {
      background-color: var(--text-danger);
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .skip-hint {
      position: absolute;
      bottom: 6px;
      right: 12px;
      font-size: 0.75rem;
      color: #444;
      letter-spacing: 1px;
    }

    /* Choice Options Container */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .choice-btn {
      background: #080808;
      border: 1px solid #333;
      color: #ccc;
      font-family: var(--font-pixel);
      font-size: 1.05rem;
      letter-spacing: 1.5px;
      padding: 14px 18px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      line-height: 1.5;
      transition: all 0.2s ease;
      position: relative;
    }

    .choice-btn:hover:not(:disabled) {
      background: #141414;
      border-color: #777;
      color: #fff;
      transform: translateX(4px);
    }

    .choice-prefix {
      color: var(--text-accent);
      font-family: var(--font-num);
      font-size: 0.85rem;
    }

    /* Strikethrough for deadly choices in subsequent loops */
    .choice-btn.trauma-struck {
      border-color: #3a151b;
      background: #0d0607;
      color: #775558;
    }

    .choice-btn.trauma-struck:hover {
      border-color: #66222b;
      color: #aa777d;
      transform: none;
    }

    .choice-btn.trauma-struck .choice-label {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: #882233;
    }

    .trauma-badge {
      display: inline-block;
      margin-left: auto;
      font-size: 0.8rem;
      color: #aa3344;
      border: 1px solid #661822;
      padding: 2px 6px;
      letter-spacing: 1px;
      background: rgba(100, 20, 30, 0.2);
    }

    /* Trauma recoil alert box */
    .trauma-box {
      border: 1px dashed var(--text-danger);
      background: rgba(40, 5, 10, 0.7);
      padding: 16px 20px;
      color: #ff99aa;
      font-size: 1.05rem;
      line-height: 1.8;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      animation: traumaShake 0.4s ease;
      display: none;
    }

    @keyframes traumaShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }

    /* Clues / Inventory Tray */
    .inventory-tray {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid #1a1a1a;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #666;
    }

    .inventory-label {
      color: #888;
      letter-spacing: 1px;
    }

    .item-chip {
      background: #111;
      border: 1px solid #333;
      color: #bbb;
      padding: 3px 8px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .item-chip:hover {
      border-color: #666;
      color: #fff;
    }

    /* Modal / Popups (Sandbox-safe replacement for alert/confirm) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .modal-box {
      background: #090909;
      border: 2px solid #555;
      max-width: 520px;
      width: 100%;
      padding: 26px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    .modal-title {
      font-size: 1.25rem;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: 14px;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
    }

    .modal-desc {
      font-size: 1.05rem;
      line-height: 1.9;
      color: #bbb;
      margin-bottom: 24px;
      white-space: pre-wrap;
    }

    .modal-btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .modal-close-btn {
      background: #111;
      border: 1px solid #666;
      color: #fff;
      font-family: var(--font-pixel);
      font-size: 0.95rem;
      padding: 8px 18px;
      cursor: pointer;
      display: block;
    }

    .modal-close-btn:hover {
      background: #fff;
      color: #000;
    }

    /* Death Screen Overlay */
    .death-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      z-index: 2000;
      cursor: pointer;
    }

    .death-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      pointer-events: none;
      opacity: 0;
    }

    .death-title {
      font-size: 3.5rem;
      letter-spacing: 12px;
      color: var(--text-danger);
      margin-bottom: 24px;
      text-shadow: 0 0 16px rgba(255, 34, 68, 0.8);
      animation: deathGlitch 1.5s infinite;
    }

    @keyframes deathGlitch {
      0%, 100% { transform: none; opacity: 1; }
      92% { transform: skewX(-5deg); opacity: 0.9; }
      94% { transform: skewX(5deg); opacity: 1; }
      96% { transform: translate(-2px, 1px); }
    }

    .death-desc {
      max-width: 600px;
      font-size: 1.25rem;
      line-height: 2;
      color: #cccccc;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    .death-hint {
      font-size: 1.05rem;
      color: #ff5566;
      letter-spacing: 4px;
      animation: pulseSubtle 1.8s infinite;
    }

    /* Ending Screen */
    .ending-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      z-index: 2000;
    }

    .ending-tag {
      font-size: 1.1rem;
      letter-spacing: 4px;
      color: #888;
      margin-bottom: 16px;
    }

    .ending-title {
      font-size: 2.8rem;
      letter-spacing: 8px;
      color: #fff;
      margin-bottom: 24px;
    }

    .ending-desc {
      max-width: 650px;
      font-size: 1.15rem;
      line-height: 2.2;
      color: #bbb;
      margin-bottom: 40px;
      text-align: left;
      white-space: pre-wrap;
    }

    .ending-restart-btn {
      background: transparent;
      border: 2px solid #666;
      color: #fff;
      font-family: var(--font-pixel);
      font-size: 1.15rem;
      letter-spacing: 4px;
      padding: 12px 30px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ending-restart-btn:hover {
      background: #fff;
      color: #000;
    }

    /* Common utility animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      .hud-title { font-size: 1.15rem; letter-spacing: 2px; }
      .hud-loop { font-size: 0.8rem; padding: 2px 5px; }
      .title-logo-large { font-size: 2.8rem; letter-spacing: 10px; }
      .dialog-box { font-size: 1.05rem; padding: 18px; min-height: 150px; }
      .choice-btn { font-size: 0.95rem; padding: 12px 14px; }
      .death-title { font-size: 2.5rem; letter-spacing: 8px; }
      .death-desc { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <!-- CRT Scanlines and Atmospheric Overlays -->
  <div class="crt-overlay" aria-hidden="true"></div>
  <div class="vignette-overlay" id="vignette" aria-hidden="true"></div>

  <!-- HUD Header -->
  <header class="hud" id="hud">
    <div class="hud-title-wrap">
      <span class="hud-title" id="hud-title">浴室</span>
      <!-- Loop/Death counter: Strictly hidden in Round 1! Only unlocked after 1st death -->
      <span class="hud-loop" id="hud-loop">輪迴 / 死亡次數：0</span>
    </div>
    <div class="hud-tools">
      <button class="hud-btn" id="audio-toggle-btn" title="切換音效">[ 聲音: 開 ]</button>
      <button class="hud-btn" id="restart-btn" title="重啟記憶">[ 重置 ]</button>
    </div>
  </header>

  <!-- Main Game Container -->
  <main class="game-container">
    
    <!-- 1. Title Screen (Cover) -->
    <section class="title-screen" id="title-screen">
      <h1 class="title-logo-large">浴 室</h1>
      <p class="title-subtext">
        —— 極簡像素文字恐怖解謎 ——<br>
        「滴... 答... 滴... 答...」<br>
        究竟是液體低落的聲音，還是指針行走的聲響
      </p>
      <p class="title-quote">
        那是每早 07:00 發生的奇聞軼事。
      </p>
      <button class="start-btn" id="start-game-btn">[ 開始遊戲 ]</button>
      <div class="title-footer">
        ※ 點擊對話框任意處可快速跳過打字機動畫。<br>
        請開啟音效，感受深水下的呼吸。
      </div>
    </section>

    <!-- 2. Interactive In-Game Area -->
    <section class="play-area" id="play-area">
      <!-- Scene Metadata -->
      <div class="scene-meta">
        <span class="scene-location" id="scene-location">【 臥室 】</span>
        <span class="scene-time" id="scene-time">07:00</span>
      </div>

      <!-- Psychological Trauma Warning Box -->
      <div class="trauma-box" id="trauma-box"></div>

      <!-- Dialogue / Terminal Window -->
      <div class="dialog-box" id="dialog-box" tabindex="0" title="點擊快速顯示全部文字">
        <span class="typewriter-content" id="typewriter-text"></span>
        <span class="terminal-cursor" id="terminal-cursor"></span>
        <span class="skip-hint">[點擊加速]</span>
      </div>

      <!-- Action Choices -->
      <div class="choices-container" id="choices-container"></div>

      <!-- Clues / Items Bar -->
      <div class="inventory-tray" id="inventory-tray">
        <span class="inventory-label">已掌握線索：</span>
        <div id="items-list" style="display:flex; gap:8px; flex-wrap:wrap;">
          <span style="color:#444; font-size:0.8rem;">(尚無)</span>
        </div>
      </div>
    </section>

  </main>

  <!-- Death Overlay Screen -->
  <div class="death-overlay" id="death-overlay">
    <div class="death-flash" id="death-flash"></div>
    <h2 class="death-title">【 你 死 了 】</h2>
    <div class="death-desc" id="death-reason">眼前逐漸陷入一片黑暗... 意識墮入無底深淵。</div>
    <div class="death-hint">[ 點擊重新甦醒 ]</div>
  </div>

  <!-- Item Inspect Modal -->
  <div class="modal-overlay" id="item-modal">
    <div class="modal-box">
      <h3 class="modal-title" id="modal-item-title">線索詳情</h3>
      <div class="modal-desc" id="modal-item-desc"></div>
      <button class="modal-close-btn" id="modal-close-btn" style="margin-left: auto;">[ 關閉 ]</button>
    </div>
  </div>

  <!-- Custom In-Page Reset Confirm Modal (Sandbox-Safe, no alert/confirm) -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-box">
      <h3 class="modal-title">重新啟動輪迴？</h3>
      <div class="modal-desc">確定要完全抹除所有記憶（重返最初第 1 輪迴）嗎？所有的死亡次數與創傷印記將會歸零。</div>
      <div class="modal-btn-row">
        <button class="modal-close-btn" id="confirm-cancel-btn">[ 取消 ]</button>
        <button class="modal-close-btn" id="confirm-ok-btn" style="border-color: #ff3344; color: #ff5566;">[ 確認重置 ]</button>
      </div>
    </div>
  </div>

  <!-- Game Ending Screen -->
  <div class="ending-overlay" id="ending-overlay">
    <div class="ending-tag" id="ending-tag">ENDING 1</div>
    <h2 class="ending-title" id="ending-title">結局標題</h2>
    <div class="ending-desc" id="ending-desc">結局內容</div>
    <button class="ending-restart-btn" id="ending-restart-btn">[ 再次墜入輪迴 ]</button>
  </div>

  <!-- Game Logic & Web Audio Synthesizer -->
  <script>
    /* =====================================================================
       1. Web Audio API Retro Sound Synthesizer
       ===================================================================== */
    const SoundManager = {
      ctx: null,
      enabled: true,

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }

          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);

    function increaseTruth(delta) {
      GameState.truth = Math.min(100, GameState.truth + delta);
      // When truth >= 70%: Trigger Mutation!
      if (GameState.truth >= 70 && !GameState.mutated) {
        GameState.mutated = true;
        triggerTruthMutation();
      }
    }

    function triggerTruthMutation() {
      SoundManager.playGlitchBurst();
      SoundManager.playHeartbeat();
      
      // Add visual glitch class to body
      document.body.classList.add('truth-high');

      // Twitch title animation: 浴室 -> 浴䶮 -> 浴逝
      elHudTitle.textContent = '浴䶮';
      elHudTitle.classList.add('mutated');

      setTimeout(() => {
        elHudTitle.textContent = '浴逝';
      }, 400);

    // Render Scene
    function renderScene(sceneId) {
      const scene = Scenes[sceneId];
      if (!scene) return;

      GameState.currentSceneId = sceneId;
      elSceneLoc.textContent = scene.location;
      elSceneTime.textContent = scene.time;
      elTraumaBox.style.display = 'none'; // hide trauma box on new scene

      if (scene.onEnter) {
        scene.onEnter();
      }

      updateInventoryBar();
      updateHud();

      const text = typeof scene.text === 'function' ? scene.text() : scene.text;
      startTypewriter(text, () => {
        renderChoices(scene);
      });
    }

    // Typewriter effect
    function startTypewriter(text, onComplete) {
      if (typewriterTimer) clearInterval(typewriterTimer);
      isTypewriting = true;
      currentFullText = text;
      elTypeText.textContent = '';
      elChoices.innerHTML = ''; // hide choices while typing
      elCursor.style.display = 'inline-block';

      let i = 0;
      const speed = 24; // ms per char

      typewriterTimer = setInterval(() => {
        if (i < text.length) {
          elTypeText.textContent += text.charAt(i);
          if (i % 3 === 0 && text.charAt(i).trim()) {
            SoundManager.playTypeTick();
          }
          i++;
        } else {
          finishTypewriter(onComplete);
        }
      }, speed);
    }

    function skipTypewriter() {
      if (!isTypewriting) return;
      if (typewriterTimer) clearInterval(typewriterTimer);
      elTypeText.textContent = currentFullText;
      finishTypewriter(() => {
        const scene = Scenes[GameState.currentSceneId];
        renderChoices(scene);
      });
    }

    function finishTypewriter(callback) {
      if (typewriterTimer) clearInterval(typewriterTimer);
      isTypewriting = false;
      elCursor.style.display = 'inline-block';
      if (callback) callback();
    }

    // Render choices
    function renderChoices(scene) {
      elChoices.innerHTML = '';
      const choices = typeof scene.choices === 'function' ? scene.choices() : scene.choices;
      if (!choices || choices.length === 0) return;

      choices.forEach((choice, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';

        const isTrauma = GameState.traumaSet.has(choice.id);

        if (isTrauma) {
          btn.classList.add('trauma-struck');
          btn.innerHTML = `
            <span class="choice-prefix">[!]</span>
            <span class="choice-label">${choice.label}</span>
            <span class="trauma-badge">[ 創傷記憶 ]</span>
          `;
          // Clicking trauma choice triggers psychological recoil without dying
          btn.addEventListener('click', () => {
            triggerTraumaRecoil(choice.traumaText || '【創傷】那股令人窒息的痛楚浮上心頭，你下意識地縮回了手，絕對不要再去送死。');
          });
        } else {
          btn.innerHTML = `
            <span class="choice-prefix">[${idx + 1}]</span>
            <span class="choice-label">${choice.label}</span>
          `;
          btn.addEventListener('click', () => {
            handleChoiceClick(choice);
          });
        }

        elChoices.appendChild(btn);
      });
    }

    // Handle normal choice click
    function handleChoiceClick(choice) {
      SoundManager.playTypeTick();

      // Check if it's a fatal choice
      if (choice.isFatal) {
        triggerDeath(choice.id, choice.action);
        return;
      }

      // Special endings
      if (choice.action === 'ending_escape') {
        showEnding('escape');
        return;
      }
      if (choice.action === 'ending_drown') {
        showEnding('drown');
        return;
      }
      if (choice.action === 'ending_true') {
        showEnding('true');
        return;
      }

      // Normal scene transition
      renderScene(choice.action);
    }

    // Trigger Trauma recoil text
    function triggerTraumaRecoil(text) {
      SoundManager.playHeartbeat();
      elTraumaBox.textContent = text;
      elTraumaBox.style.display = 'block';
      elTraumaBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Death mechanism
    function triggerDeath(choiceId, deathKey) {
      GameState.isDead = true;
      GameState.deaths++;
      GameState.traumaSet.add(choiceId);

      SoundManager.playDeathSound();

      const deathInfo = Deaths[deathKey] || {
        title: '【 你 死 了 】',
        desc: '意識被深冷的水流無情吞噬。'
      };

      elDeathReason.textContent = deathInfo.desc;

      // Flash white then black
      elDeathFlash.style.opacity = '1';
      elDeathOverlay.style.display = 'flex';

      setTimeout(() => {
        elDeathFlash.style.transition = 'opacity 0.6s ease';
        elDeathFlash.style.opacity = '0';
      }, 100);
    }

    // Awaken from Death (re-waking at 07:00 bedroom)
    function awakenFromDeath() {
      GameState.isDead = false;
      elDeathOverlay.style.display = 'none';

      SoundManager.playAwakenChime();
      SoundManager.playHeartbeat();

      // Update HUD to reveal Loop / Death Counter!
      updateHud();

      // Reset temporary flags if appropriate, but keep permanent truth & traumas
      renderScene('bedroom_wake');
    }

    // Update HUD display rules
    function updateHud() {
      // Rule 1: Round 1 (deaths === 0), hide Death Count & Truth completely!
      if (GameState.deaths > 0) {
        elHudLoop.classList.add('visible');
        elHudLoop.textContent = `輪迴 / 死亡次數：${GameState.deaths}`;
      } else {
        elHudLoop.classList.remove('visible');
      }

      // Rule 3: If truth >= 70% and not yet visually marked mutated
      if (GameState.truth >= 70 && !GameState.mutated) {
        triggerTruthMutation();
      }
    }

    // Update Inventory UI
    function updateInventoryBar() {
      const keys = Object.keys(GameState.inventory);
      elItemsList.innerHTML = '';
      if (keys.length === 0) {
        elItemsList.innerHTML = '<span style="color:#444; font-size:0.8rem;">(尚無)</span>';
        return;
      }
      keys.forEach(k => {
        const item = GameState.inventory[k];
        const chip = document.createElement('span');
        chip.className = 'item-chip';
        chip.textContent = `[ ${item.name} ]`;
        chip.title = '點擊查看線索';
        chip.addEventListener('click', () => {
          showItemModal(item);
        });
        elItemsList.appendChild(chip);
      });
    }

    // Item Inspection Modal
    function showItemModal(item) {
      SoundManager.playTypeTick();
      elModalTitle.textContent = item.name;
      elModalDesc.textContent = item.desc;
      elItemModal.style.display = 'flex';
    }

    // Show Game Ending
    function showEnding(type) {
      GameState.isEnding = true;
      const end = Endings[type];
      elEndingTag.textContent = end.tag;
      elEndingTitle.textContent = end.title;
      elEndingDesc.textContent = end.desc;

      if (type === 'true') {
        elEndingTitle.style.color = '#77ffaa';
        elEndingRestart.textContent = '[ 迎向新生的晨曦 ]';
        SoundManager.playAwakenChime();
      } else {
        elEndingTitle.style.color = '#ff4455';
        elEndingRestart.textContent = '[ 再次墜入輪迴 ]';
        SoundManager.playDeathSound();
      }

      elEndingOverlay.style.display = 'flex';
    }

    // Full Reset
    function fullReset() {
      GameState.started = false;
      GameState.deaths = 0;
      GameState.truth = 0;
      GameState.mutated = false;
      GameState.currentSceneId = 'bedroom_wake';
      GameState.traumaSet.clear();
      GameState.inventory = {};
      GameState.isDead = false;
      GameState.isEnding = false;
      GameState.flags = {
        readPrescription: false,
        readMirrorNote: false,
        checkedFridge: false,
        hasKey: false,
        cabinetUnlocked: false,
        hasTowel: false,
        hasTape: false,
        wipedMirror: false,
        playedTape: false,
        drainedTub: false,
        inspectedPhoto: false
      };

      document.body.classList.remove('truth-high');
      elHudTitle.textContent = '浴室';
      elHudTitle.classList.remove('mutated');
      elHudLoop.classList.remove('visible');

      elPlayArea.style.display = 'none';
      elTitleScreen.style.display = 'flex';
    }
  </script>
</body>
</html>
