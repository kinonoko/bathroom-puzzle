<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="tab-title">浴室</title>
  <!-- 引入像素日系/復古漢字字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="vignette-overlay"></div>

  <!-- 1. 遊戲開始前：標題封面畫面 -->
  <section id="title-screen" class="screen-view active">
    <div class="title-wrapper">
      <h1 class="main-pixel-title">浴 室</h1>
      <button id="start-game-btn" class="pixel-link-btn">[ 開始遊戲 ]</button>
    </div>
  </section>

  <!-- 2. 遊戲主畫面（極簡黑底文字探索） -->
  <main id="game-screen" class="screen-view">
    <!-- 頂部 Header：第一輪極簡，死亡後才解鎖次數 -->
    <header class="game-hud">
      <span id="hud-title" class="hud-title">浴室</span>
      <span id="hud-deaths" class="hud-deaths hidden">輪迴次數：<span id="death-counter">0</span></span>
    </header>

    <!-- 打字機文字顯示區域 -->
    <div id="text-viewport" class="text-viewport">
      <div id="typewriter-output"></div>
      <span id="cursor" class="blinking-cursor">_</span>
    </div>

    <!-- 密碼輸入框（預設隱藏） -->
    <div id="puzzle-box" class="puzzle-box hidden">
      <div id="puzzle-prompt" class="puzzle-prompt"></div>
      <div class="input-line">
        <span class="prompt-arrow">&gt;</span>
        <input type="text" id="puzzle-input" autofocus autocomplete="off" spellcheck="false">
        <button id="puzzle-submit-btn" class="pixel-link-btn">[ 輸入 ]</button>
      </div>
      <div id="puzzle-error" class="puzzle-error"></div>
    </div>

    <!-- 純文字選項列表 -->
    <div id="choices-wrapper" class="choices-wrapper"></div>
  </main>

  <!-- 3. 死亡黑幕過場 -->
  <section id="death-screen" class="screen-view">
    <div class="death-wrapper">
      <h2 class="death-header">—— 意 識 中 斷 ——</h2>
      <p id="death-desc" class="death-desc"></p>
      <button id="respawn-btn" class="pixel-link-btn">[ 大口呼吸…… ]</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
